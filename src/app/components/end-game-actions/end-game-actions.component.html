<div
	class="mx-auto flex w-full shrink-0 flex-col gap-2.5"
	[class.max-w-xs]="maxWidth() === 'xs'"
	[class.max-w-sm]="maxWidth() === 'sm'"
>
	@if (showReplay()) {
		<div class="group/action w-full">
			<button
				type="button"
				(click)="onReplayClick($event)"
				[disabled]="isMultiReplay() && (iWantReplay() || opponentLeft())"
				class="group relative flex min-h-14 w-full transform-gpu will-change-transform items-center gap-3 overflow-hidden rounded-2xl border border-rose-400/25 bg-gradient-to-r from-rose-500/[0.16] via-rose-500/[0.1] to-orange-400/[0.07] px-3.5 py-2.5 text-left shadow-[0_14px_34px_rgba(136,19,55,0.18)] transition-[transform,border-color,box-shadow] duration-300 ease-out group-hover/action:-translate-y-0.5 group-hover/action:border-rose-300/45 group-hover/action:shadow-[0_18px_42px_rgba(136,19,55,0.25)] active:translate-y-0 disabled:cursor-not-allowed disabled:border-white/[0.08] disabled:from-slate-800/80 disabled:via-slate-800/70 disabled:to-slate-900/80 disabled:shadow-none disabled:group-hover/action:translate-y-0"
			>
				<span class="pointer-events-none absolute -right-7 -top-8 h-24 w-24 rounded-full bg-rose-400/10 blur-2xl transition-colors duration-300 group-hover/action:bg-rose-300/20"></span>
				<span class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-rose-300/20 bg-rose-400/10 text-rose-200 shadow-inner shadow-white/[0.04] group-disabled:border-white/[0.08] group-disabled:bg-white/[0.04] group-disabled:text-slate-400">
					@if (isMultiReplay() && iWantReplay() && !opponentWantsReplay()) {
						<iconify-icon [icon]="ICONS.loading" class="animate-spin text-xl"></iconify-icon>
					} @else {
						<iconify-icon [icon]="ICONS.refresh" class="text-xl transition-transform duration-500 group-hover/action:rotate-180 group-disabled:rotate-0"></iconify-icon>
					}
				</span>
				<span class="relative min-w-0 flex-1">
					<span class="block text-[15px] font-black tracking-[0.01em] text-white">Rejouer</span>
					@if (isMultiReplay() && opponentLeft()) {
						<span class="mt-0.5 block text-xs font-semibold text-slate-500">L'adversaire a déjà quitté la partie</span>
					} @else if (isMultiReplay() && iWantReplay() && !opponentWantsReplay()) {
						<span class="mt-0.5 block text-xs font-semibold text-slate-400">En attente de l'adversaire…</span>
					} @else if (isMultiReplay() && opponentWantsReplay()) {
						<span class="mt-0.5 block text-xs font-semibold text-emerald-300">L'adversaire est prêt pour une revanche</span>
					} @else {
						<span class="mt-0.5 block text-xs font-semibold text-rose-200/65">{{ isMultiReplay() ? 'Proposer une revanche' : 'Relancer une nouvelle partie' }}</span>
					}
				</span>
			</button>
		</div>
	}

	<ng-content></ng-content>

	@if (showHome()) {
		<div class="group/action w-full">
			<button
				type="button"
				(click)="onGoHomeClick($event)"
				class="flex min-h-14 w-full transform-gpu will-change-transform items-center gap-3 rounded-2xl border border-white/[0.09] bg-white/[0.045] px-3.5 py-2.5 text-left shadow-[inset_0_1px_0_rgba(255,255,255,0.035)] transition-[transform,border-color,background-color] duration-300 ease-out group-hover/action:-translate-y-0.5 group-hover/action:border-white/[0.18] group-hover/action:bg-white/[0.075] active:translate-y-0"
			>
				<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-white/[0.08] bg-slate-950/45 text-slate-300 transition-colors duration-300 group-hover/action:border-cyan-300/20 group-hover/action:bg-cyan-400/[0.08] group-hover/action:text-cyan-200">
					<iconify-icon [icon]="ICONS.home" class="text-lg"></iconify-icon>
				</span>
				<span class="min-w-0 flex-1">
					<span class="block text-[15px] font-black tracking-[0.01em] text-slate-100">Retour au menu</span>
					<span class="mt-0.5 block text-xs font-semibold text-slate-500">Choisir un autre mode</span>
				</span>
			</button>
		</div>
	}
</div>
