<section class="relative isolate flex w-full flex-col items-center px-4">
  <div class="pointer-events-none absolute -top-16 left-1/2 -z-10 h-56 w-56 -translate-x-1/2 rounded-full bg-red-500/10 blur-3xl"></div>

  <div class="mb-7 flex max-w-2xl flex-col items-center text-center sm:mb-9">
    <div class="mb-4 flex items-center gap-2 rounded-full border border-white/10 bg-white/[0.045] px-3 py-1.5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 shadow-lg shadow-black/10">
      <span class="h-1.5 w-1.5 rounded-full bg-red-400 shadow-[0_0_12px_rgba(248,113,113,0.9)]"></span>
      Configuration rapide
    </div>
    <div class="flex items-center gap-3">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.055] sm:h-14 sm:w-14">
        <iconify-icon [icon]="icon" [ngClass]="[iconSize, iconColor]"></iconify-icon>
      </div>
      <h1 class="text-2xl font-black tracking-[-0.04em] text-white sm:text-4xl">{{ title }}</h1>
    </div>
    <p class="mt-3 text-sm leading-relaxed text-slate-400 sm:text-base">Comment veux-tu jouer aujourd'hui&nbsp;?</p>
  </div>

  <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-stretch sm:gap-4" [ngClass]="maxWidth">
    <ng-content />
  </div>
</section>
