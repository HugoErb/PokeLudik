<div class="group/mode-card flex h-full min-w-0 w-full">
<button
  (click)="selected.emit()"
  [disabled]="disabled"
  [attr.aria-pressed]="isSelected"
  class="relative flex h-full min-h-[112px] w-full transform-gpu will-change-transform overflow-hidden rounded-[22px] border border-white/10 bg-slate-900/70 p-4 text-left shadow-xl shadow-black/10 transition-[transform,border-color,box-shadow] duration-300 ease-out group-hover/mode-card:-translate-y-1 group-hover/mode-card:shadow-2xl disabled:cursor-not-allowed disabled:opacity-50 disabled:group-hover/mode-card:translate-y-0 disabled:group-hover/mode-card:shadow-xl sm:min-h-[230px] sm:flex-col sm:p-6"
  [ngClass]="isSelected ? accentClasses.selected : [accentClasses.border, accentClasses.shadow]"
>
  <div class="pointer-events-none absolute -right-12 -top-12 h-36 w-36 rounded-full opacity-0 blur-3xl transition-opacity duration-300 group-hover/mode-card:opacity-100" [ngClass]="accentClasses.glow"></div>
  @if (isSelected) {
    <span class="absolute right-4 top-4 flex items-center gap-1.5 rounded-full bg-white/[0.07] px-2.5 py-1 text-[9px] font-black uppercase tracking-[0.14em] text-white">
      <span class="h-1.5 w-1.5 rounded-full" [ngClass]="accentClasses.pill"></span>
      Sélectionné
    </span>
  }
  <div
    class="relative flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl border transition-colors sm:h-16 sm:w-16"
    [ngClass]="[accentClasses.bg, accentClasses.iconBorder, accentClasses.iconBgHover]"
  >
    @if (isLoading) {
      <iconify-icon [icon]="ICONS.loading" class="animate-spin text-2xl sm:text-3xl" [ngClass]="accentClasses.text"></iconify-icon>
    } @else {
      <iconify-icon [icon]="icon" class="text-2xl sm:text-3xl" [ngClass]="accentClasses.text"></iconify-icon>
    }
  </div>
  <div class="relative min-w-0 flex-1 pl-[18px] sm:mt-[18px] sm:flex sm:flex-col sm:justify-end sm:pl-0">
    <h2 class="pr-16 text-base font-black tracking-[-0.02em] text-white sm:pr-0 sm:text-xl">{{ title }}</h2>
    <p class="mt-1 text-xs leading-relaxed text-slate-400 sm:mt-2 sm:text-sm">{{ description }}</p>
    <div class="mt-4 hidden h-4 items-center text-[10px] font-black uppercase tracking-[0.14em] sm:flex" [ngClass]="accentClasses.text">
      <span class="inline-flex h-4 items-center leading-none">{{ isSelected ? 'Configurer' : 'Choisir ce mode' }}</span>
      <iconify-icon aria-hidden="true" icon="mdi:arrow-right" class="relative top-0 ml-1.5 block h-[15px] w-[15px] shrink-0 text-[15px] leading-none transition-transform duration-300 ease-out will-change-transform group-hover/mode-card:translate-x-1"></iconify-icon>
    </div>
  </div>
</button>
</div>
